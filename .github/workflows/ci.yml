name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: dotnet
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Start SQL LocalDB for existing migration tests
        shell: pwsh
        run: |
          $instances = & sqllocaldb info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($instances -notcontains "MSSQLLocalDB") {
            & sqllocaldb create MSSQLLocalDB
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & sqllocaldb start MSSQLLocalDB
          exit $LASTEXITCODE
      - name: Build backend
        run: dotnet build backend/ClinicalRag.Api.csproj --nologo
      - name: Test backend (no filtered or suppressed failures)
        if: ${{ !cancelled() }}
        run: dotnet test backend.Tests/ClinicalRag.Tests.csproj --nologo

  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Existing numpy<2 and PyMuPDF pins have compatible Python 3.11 wheels.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install existing Python requirements
        run: python -m pip install -r requirements.txt
      - name: Run complete Python tests
        run: python -m pytest tests -q

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      # Run all three checks even after a red step; each failure stays fatal.
      - name: Lint frontend
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Test frontend (Node utilities and Vitest)
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build frontend
        if: ${{ !cancelled() }}
        run: npm run build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan full fetched Git history (redacted; no baseline exclusions)
        run: gitleaks git --redact=100 --no-banner --ignore-gitleaks-allow --log-opts="--all"

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [dotnet, pytest, frontend, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Require every job to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python .github/scripts/check_ci_gate.py
